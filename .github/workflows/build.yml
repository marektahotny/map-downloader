name: Build Archicad 23 add-on

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVKIT_VERSION: "23.3006"
  DEVKIT_URL: "https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/23.3006/API.Development.Kit.WIN.23.3006.zip"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache API DevKit 23
        id: cache-devkit
        uses: actions/cache@v4
        with:
          path: devkit
          key: devkit-win-${{ env.DEVKIT_VERSION }}

      - name: Download API DevKit 23 (Graphisoft)
        if: steps.cache-devkit.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force devkit | Out-Null
          Invoke-WebRequest -Uri $env:DEVKIT_URL -OutFile devkit\devkit.zip
          Expand-Archive devkit\devkit.zip -DestinationPath devkit -Force
          Remove-Item devkit\devkit.zip
          Get-ChildItem devkit

      - name: Ensure MSVC v141 toolset (Visual Studio 2017)
        id: toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Write-Host "::notice::Visual Studio: $vs"
          $has = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.v141.x86.x64 -property installationPath
          if (-not $has) {
            Write-Host "::notice::Installing MSVC v141 toolset"
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $args = "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --quiet --norestart --nocache"
            $p = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
            Write-Host "::notice::vs_installer exit code $($p.ExitCode)"
            $has = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.v141.x86.x64 -property installationPath
          }
          if ($has) {
            Write-Host "::notice::Using toolset v141"
            "toolset=v141" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::warning::v141 not available, falling back to v143 (binary compatible, needs VC++ 2015-2022 redistributable)"
            "toolset=v143" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Embed web UI
        run: python tools/embed_html.py

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild addon\PilonMapDownloader.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=${{ steps.toolset.outputs.toolset }} /v:minimal /nologo 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          # re-emit compiler errors as annotations (readable through the GitHub API)
          $n = 0
          Get-Content build.log | Where-Object { $_ -match ' error | error[A-Z]*[0-9]+|: fatal error|MSB[0-9]+' } | Select-Object -Unique | ForEach-Object {
            if ($n -lt 45) { $msg = $_ -replace '::', ':' ; Write-Host "::error::$($msg.Substring(0, [Math]::Min(600, $msg.Length)))" }
            $n++
          }
          exit $code

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item addon\Build\x64\Release\PilonMapDownloader.apx dist\
          Copy-Item README.md dist\
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: PilonMapDownloader-AC23-win64
          path: dist/

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PilonMapDownloader.apx
