name: Build Archicad 23 add-on

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVKIT_VERSION: "23.3006"
  DEVKIT_URL: "https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/23.3006/API.Development.Kit.WIN.23.3006.zip"

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache API DevKit 23
        id: cache-devkit
        uses: actions/cache@v4
        with:
          path: devkit
          key: devkit-win-${{ env.DEVKIT_VERSION }}

      - name: Download API DevKit 23 (Graphisoft)
        if: steps.cache-devkit.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force devkit | Out-Null
          Invoke-WebRequest -Uri $env:DEVKIT_URL -OutFile devkit\devkit.zip
          Expand-Archive devkit\devkit.zip -DestinationPath devkit -Force
          Remove-Item devkit\devkit.zip
          Get-ChildItem devkit

      - name: Ensure MSVC v141 toolset (Visual Studio 2017)
        id: toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Write-Host "::notice::Visual Studio: $vs"
          $has = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.v141.x86.x64 -property installationPath
          if (-not $has) {
            Write-Host "::notice::Installing MSVC v141 toolset"
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $args = "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --quiet --norestart --nocache"
            $p = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
            Write-Host "::notice::vs_installer exit code $($p.ExitCode)"
            $has = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.v141.x86.x64 -property installationPath
          }
          if ($has) {
            Write-Host "::notice::Using toolset v141"
            "toolset=v141" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::warning::v141 not available, falling back to v143 (binary compatible, needs VC++ 2015-2022 redistributable)"
            "toolset=v143" >> $env:GITHUB_OUTPUT
          }
          $sdks = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory | Where-Object { $_.Name -match '^10\.0\.' -and (Test-Path (Join-Path $_.FullName 'um\windows.h')) -and (Test-Path "${env:ProgramFiles(x86)}\Windows Kits\10\Lib\$($_.Name)\um\x64\kernel32.lib") } | Sort-Object { [version]$_.Name }
          Write-Host "::notice::Windows SDKs: $(($sdks | ForEach-Object Name) -join ', ')"
          "sdk=$(($sdks | Select-Object -Last 1).Name)" >> $env:GITHUB_OUTPUT
          "sdkold=$(($sdks | Select-Object -First 1).Name)" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Embed web UI
        run: python tools/embed_html.py

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild addon\PilonMapDownloader.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=${{ steps.toolset.outputs.toolset }} /p:WindowsTargetPlatformVersion=${{ steps.toolset.outputs.sdk }} /v:minimal /nologo 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          # re-emit compiler errors as annotations (readable through the GitHub API)
          $n = 0
          Get-Content build.log | Where-Object { $_ -match ' error | error[A-Z]*[0-9]+|: fatal error|MSB[0-9]+' } | Select-Object -Unique | ForEach-Object {
            if ($n -lt 45) { $msg = $_ -replace '::', ':' ; Write-Host "::error::$($msg.Substring(0, [Math]::Min(600, $msg.Length)))" }
            $n++
          }
          exit $code

      - name: Build Graphisoft example Browser_Control (diagnostics)
        shell: pwsh
        run: |
          $ex = "devkit\API.Development.Kit.WIN.23.3006\Examples\Browser_Control\Browser_Control.vcxproj"
          msbuild $ex /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=${{ steps.toolset.outputs.toolset }} /p:WindowsTargetPlatformVersion=${{ steps.toolset.outputs.sdk }} /p:TreatWarningAsError=false /v:minimal /nologo
          Get-ChildItem -Recurse devkit\API.Development.Kit.WIN.23.3006\Examples\Browser_Control -Filter *.apx | ForEach-Object { Write-Host "::notice::example built $($_.FullName)" }

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item addon\Build\x64\Release\PilonMapDownloader.apx dist\
          Copy-Item README.md dist\
          $ex = Get-ChildItem -Recurse devkit\API.Development.Kit.WIN.23.3006\Examples\Browser_Control -Filter *.apx | Select-Object -First 1
          if ($ex) { Copy-Item $ex.FullName dist\Browser_Control_example.apx }
          Get-ChildItem dist

      - name: Build diagnostic test add-ons (T1-T4)
        shell: pwsh
        run: |
          $tc = "${{ steps.toolset.outputs.toolset }}"; $new = "${{ steps.toolset.outputs.sdk }}"; $old = "${{ steps.toolset.outputs.sdkold }}"
          New-Item -ItemType Directory -Force dist\tests | Out-Null
          function BuildMin($name, $id, $sdk) {
            (Get-Content addon\Test\Minimal.grc.in) -replace 'TEST_NAME', "`"$name`"" | Set-Content addon\Test\Minimal.grc
            (Get-Content addon\Test\MinimalFix.grc.in) -replace 'TEST_LOCAL_ID', "$id" | Set-Content addon\Test\MinimalFix.grc
            msbuild addon\Test\PilonTest.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=$tc /p:WindowsTargetPlatformVersion=$sdk /p:TestName=$name /v:minimal /nologo
            Copy-Item "addon\Test\Build\$name\$name.apx" dist\tests\
          }
          BuildMin "T1_minimal_SDK$($new.Split('.')[2])" 30001 $new
          BuildMin "T2_minimal_SDK$($old.Split('.')[2])" 30002 $old
          BuildMin "T5_sonda" 30005 $old
          $ex = "devkit\API.Development.Kit.WIN.23.3006\Examples\Browser_Control\Browser_Control.vcxproj"
          msbuild $ex /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=$tc /p:WindowsTargetPlatformVersion=$old /p:TreatWarningAsError=false /v:minimal /nologo
          Copy-Item (Get-ChildItem -Recurse devkit\API.Development.Kit.WIN.23.3006\Examples\Browser_Control -Filter *.apx | Select-Object -First 1).FullName "dist\tests\T3_example_SDK$($old.Split('.')[2]).apx"
          msbuild addon\PilonMapDownloader.vcxproj /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=$tc /p:WindowsTargetPlatformVersion=$old /v:minimal /nologo
          Copy-Item addon\Build\x64\Release\PilonMapDownloader.apx "dist\tests\T4_PilonMapDownloader_SDK$($old.Split('.')[2]).apx"
          Get-ChildItem dist\tests | ForEach-Object { Write-Host "::notice::test $($_.Name) $($_.Length)" }

      - name: Inspect add-on binary
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $apx = "addon\Build\x64\Release\PilonMapDownloader.apx"
          $size = (Get-Item $apx).Length
          $exp = (& $dumpbin.FullName /nologo /exports $apx | Select-String -Pattern 'FuncAddrs' | ForEach-Object { $_.Line.Trim() }) -join ' | '
          $dep = (& $dumpbin.FullName /nologo /dependents $apx | Select-String -Pattern '\.dll' | ForEach-Object { $_.Line.Trim() }) -join ', '
          Write-Host "::notice::apx size $size B; exports: $exp"
          Write-Host "::notice::dependencies: $dep"
          pip install --quiet pefile
          python tools/check_imports.py $apx
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: PilonMapDownloader-AC23-win64
          path: dist/

      - name: Publish build to Releases (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ac23-latest
          name: "Pilon Map Downloader – Archicad 23 (posledné zostavenie)"
          prerelease: true
          make_latest: false
          body: |
            Automatické zostavenie z vetvy main (commit ${{ github.sha }}).
            Inštalácia: skopírujte PilonMapDownloader.apx do priečinka Add-Ons v Archicade 23 alebo ho pridajte cez Možnosti › Správca doplnkov.
          files: |
            dist/PilonMapDownloader.apx
            dist/Browser_Control_example.apx
            dist/tests/*.apx

      - name: Release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PilonMapDownloader.apx
